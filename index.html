<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackinMac</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>HackinMac</h1>
        <p>iPhone ve Mac İçin Yüksek Çözünürlüklü Duvar Kağıtları</p>
    </header>

    <main>
        <!-- iPhone Duvar Kağıtları Bölümü -->
        <section class="kategori">
            <h2>iPhone Duvar Kağıtları</h2>
            <div class="gallery">
                
                <!-- 1. Kart -->
                <div class="wallpaper-card">
                    <img src="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" alt="iPhone duvar kağıdı">
                    <div class="card-info">
                        <h3>iPhone duvar kağıdı</h3>
                        <a href="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" download class="download-btn">İndir</a>
                    </div>
                </div>

                <!-- 2. Kart (İkinci Görsel) -->
                <div class="wallpaper-card">
                    <img src="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" alt="iPhone 17 Pro Max">
                    <div class="card-info">
                        <h3>iPhone 17 Pro Max</h3>
                        <a href="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" download class="download-btn">İndir</a>
                    </div>
                </div>

            </div>
        </section>

        <!-- Mac Duvar Kağıtları Bölümü -->
        <section class="kategori">
            <h2>Mac Duvar Kağıtları</h2>
            <div class="gallery">
                
                <!-- Mac Kartı -->
                <div class="wallpaper-card">
                    <img src="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" alt="MacBook duvar kağıdı">
                    <div class="card-info">
                        <h3>MacBook duvar kağıdı</h3>
                        <a href="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" download="hackinmac-duvar-kagidi.png" class="download-btn">İndir</a>
                    </div>
                </div>

            </div>
        </section>
    </main>

</body>
</html>
