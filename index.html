<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackinMac - iPhone & Mac Duvar Kağıtları</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        header h1 {
            font-size: 2.5rem;
            color: #58a6ff;
            margin-bottom: 10px;
        }

        header p {
            color: #8b949e;
            font-size: 1.1rem;
        }

        .category-title {
            margin: 30px 0 15px 0;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
            color: #f0f6fc;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .wallpaper-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.2s ease;
        }

        .wallpaper-card:hover {
            transform: translateY(-5px);
        }

        .wallpaper-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
        }

        .card-info {
            padding: 15px;
            text-align: center;
        }

        .download-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 16px;
            background-color: #238636;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .download-btn:hover {
            background-color: #2ea043;
        }
    </style>
</head>
