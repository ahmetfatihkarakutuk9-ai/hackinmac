<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackinMac</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            color: #2563eb;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        header p {
            color: #9ca3af;
            font-size: 0.95rem;
        }
        .kategori {
            margin-bottom: 40px;
        }
        .kategori h2 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #fff;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        /* iPhone Kartı (Dik Tasarım) */
        .wallpaper-card {
            background-color: #262626;
            border-radius: 12px;
            padding: 16px;
            width: 240px;
            box-sizing: border-box;
            border: 1px solid #333;
            text-align: center;
        }
        /* Mac Kartı (Geniş Tasarım) */
        .wallpaper-card.mac-card {
            width: 380px;
        }
        .wallpaper-card img {
            width: 100%;
            height: auto;
            border-radius: 8px;
            display: block;
            margin-bottom: 12px;
        }
        .card-info h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #fff;
            font-weight: 600;
        }
        .download-btn {
            display: inline-block;
            background-color: #10b981;
            color: white;
            padding: 8px 24px;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .download-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <header>
        <h1>HackinMac</h1>
        <p>iPhone ve Mac İçin Yüksek Çözünürlüklü Duvar Kağıtları</p>
    </header>

    <main>
        <!-- iPhone Bölümü -->
        <section class="kategori">
            <h2>iPhone Duvar Kağıtları</h2>
            <div class="gallery">
                <div class="wallpaper-card">
                    <img src="iphone_vadi.png" alt="iPhone Vadi Duvar Kağıdı">
                    <div class="card-info">
                        <h3>Fütüristik Vadi</h3>
                        <a href="iphone_vadi.png" download="iphone-vadi.png" class="download-btn">İndir</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Mac Bölümü -->
        <section class="kategori">
            <h2>Mac Duvar Kağıtları</h2>
            <div class="gallery">
                <div class="wallpaper-card mac-card">
                    <img src="iphone_vadi.png" alt="MacBook Vadi Duvar Kağıdı">
                    <div class="card-info">
                        <h3>Fütüristik Vadi (Mac)</h3>
                        <a href="iphone_vadi.png" download="macbook-vadi.png" class="download-btn">İndir</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
