<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackinMac</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            color: #3b82f6;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        header p {
            color: #aaa;
        }
        .kategori {
            margin-bottom: 40px;
        }
        .kategori h2 {
            border-bottom: 2px solid #333;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .wallpaper-card {
            background-color: #2a2a2a;
            border-radius: 12px;
            padding: 15px;
            width: 260px;
            box-sizing: border-box;
            border: 1px solid #333;
        }
        .wallpaper-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }
        .card-info {
            margin-top: 15px;
            text-align: center;
        }
        .card-info h3 {
            font-size: 1.1rem;
            margin-bottom: 10px;
            color: #fff;
        }
        .download-btn {
            display: inline-block;
            background-color: #10b981;
            color: white;
            padding: 8px 20px;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .download-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <header>
        <h1>HackinMac</h1>
        <p>iPhone ve Mac İçin Yüksek Çözünürlüklü Duvar Kağıtları</p>
    </header>

    <main>
        <!-- iPhone Bölümü -->
        <section class="kategori">
            <h2>iPhone Duvar Kağıtları</h2>
            <div class="gallery">
                
                <div class="wallpaper-card">
                    <img src alt="iPhone duvar kağıdı">
                    <div class="card-info">
                        <h3>iPhone duvar kağıdı</h3>
                        <a href="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" download class="download-btn">İndir</a>
                    </div>
                </div>

                <div class="wallpaper-card">
                    
                    <div class="card-info">
                        
                        
                    </div>
                </div>

            </div>
        </section>

        <!-- Mac Bölümü -->
        <section class="kategori">
            <h2>Mac Duvar Kağıtları</h2>
            <div class="gallery">
                
                <div class="wallpaper-card">
                    <img src="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" alt="MacBook duvar kağıdı">
                    <div class="card-info">
                        <h3>MacBook duvar kağıdı</h3>
                        <a href="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" download="hackinmac-duvar-kagidi.png" class="download-btn">İndir</a>
                    </div>
                </div>

            </div>

</body>
