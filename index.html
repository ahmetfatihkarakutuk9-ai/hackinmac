<!DOCTYPE html>

<head>

    <header>

        <section class="kategori">

            <div class="gallery" style="display: flex; gap: 20px; flex-wrap: wrap;">
                
                <!-- 1. iPhone Kartı -->
                <div class="wallpaper-card" style="width: 280px;">
                    <img src="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" alt="iPhone Duvar Kağıdı" style="width: 100%; border-radius: 8px;">
                    <div class="card-info">
                        <h3>iPhone duvar kağıdı</h3>
                        <a href="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" download class="download-btn">İndir</a>

                <!-- 2. iPhone Kartı -->
                <div class="wallpaper-card" style="width: 280px;">

                    <div class="card-info">

        <!-- Mac Duvar Kağıtları Bölümü -->

            <h2>Mac Duvar Kağıtları</h2>
            <div class="gallery" style="display: flex; gap: 20px; flex-wrap: wrap;">
                
                <!-- 1. Mac Kartı -->
                <div class="wallpaper-card" style="width: 280px;">
                    <img src="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" alt="MacBook Duvar Kağıdı" style="width: 100%; border-radius: 8px;">
                    <div class="card-info">
                        <h3>MacBook duvar kağıdı</h3>
                        <a href="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" download="hackinmac-duvar-kagidi.png" class="download-btn">İndir</a>
                    </div>
                </div>

                <!-- 2. Mac Kartı -->
                <div class="wallpaper-card" style="width: 280px;">
                    <img src="macbook_wallpaper_1680x1050.png" alt="MacBook Pro HD" style="width: 100%; border-radius: 8px;">
                    <div class="card-info">
                        <h3>MacBook Pro HD</h3>
                        <a href="macbook_wallpaper_1680x1050.png" download class="download-btn">İndir</a>
