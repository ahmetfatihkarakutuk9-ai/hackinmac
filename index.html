<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HackinMac</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        header h1 {
            color: #2563eb;
            font-size: 2.2rem;
            margin-bottom: 8px;
        }
        header p {
            color: #9ca3af;
            font-size: 0.95rem;
        }
        .kategori {
            margin-bottom: 40px;
        }
        .kategori h2 {
            font-size: 1.4rem;
            margin-bottom: 20px;
            color: #fff;
        }
        .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }
        .wallpaper-card {
            background-color: #262626;
            border-radius: 12px;
            padding: 16px;
            width: 280px;
            box-sizing: border-box;
            border: 1px solid #333;
            text-align: center;
        }
        .wallpaper-card img {
            width: 100%;
            border-radius: 8px;
            display: block;
            margin-bottom: 12px;
        }
        .card-info h3 {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #fff;
            font-weight: 600;
        }
        .download-btn {
            display: inline-block;
            background-color: #10b981;
            color: white;
            padding: 8px 24px;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .download-btn:hover {
            background-color: #059669;
        }
    </style>
</head>
<body>

    <header>
        <h1>HackinMac</h1>
        <p>iPhone ve Mac İçin Yüksek Çözünürlüklü Duvar Kağıtları</p>
    </header>

    <main>
        <section class="kategori">
            <h2>iPhone Duvar Kağıtları</h2>
            <div class="gallery">
                
                <div class="wallpaper-card">
                    <img src="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" alt="iPhone duvar kağıdı">
                    <div class="card-info">
                        <h3>iPhone duvar kağıdı</h3>
                        <a href="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" download class="download-btn">İndir</a>
                    </div>
                </div>

                <div class="wallpaper-card">
                    <img src="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" alt="iPhone 17 Pro Max">
                    <div class="card-info">
                        <h3>iPhone 17 Pro Max</h3>
                        <a href="Gemini_Generated_Image_wnxtgpwnxtgpwnxt.png" download class="download-btn">İndir</a>
                    </div>
                </div>

            </div>
        </section>
    </main>

</body>
</html>
